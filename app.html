<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>LampAI</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#07080a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{display:grid;place-items:center}
.boot{opacity:.55;font-size:14px}
</style>
</head>
<body>
<div class="boot">Opening LampAI…</div>
<script>
(async()=>{
  try{
    const response=await fetch('/index.html',{cache:'no-store'});
    let html=await response.text();

    const appHead=`
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta name="application-name" content="LampAI">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LampAI">
<meta name="mobile-web-app-capable" content="yes">
`;

    const appScript=`<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{});
  });
}
<\/script>`;

    if(/<head[^>]*>/i.test(html)){
      html=html.replace(/<head([^>]*)>/i,match=>match+appHead);
    }else{
      html=appHead+html;
    }

    if(/<\/body>/i.test(html)){
      html=html.replace(/<\/body>/i,appScript+'</body>');
    }else{
      html+=appScript;
    }

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<div class="boot">LampAI could not open. Check your connection and refresh.</div>';
  }
})();
</script>
</body>
</html>
