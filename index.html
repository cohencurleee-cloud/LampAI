<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LampAI</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0d10;
      color: white;
      height: 100vh;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #252a31;
      font-size: 21px;
      font-weight: 800;
    }

    .status {
      margin-left: auto;
      font-size: 12px;
      color: #62e59a;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px 15px;
    }

    .welcome {
      text-align: center;
      margin-top: 18vh;
    }

    .lamp {
      font-size: 60px;
    }

    h1 {
      font-size: 34px;
      margin: 10px 0;
    }

    .welcome p {
      color: #8d96a3;
    }

    .suggestions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .suggestions button {
      background: #171b21;
      color: white;
      border: 1px solid #303640;
      border-radius: 12px;
      padding: 12px 15px;
    }

    .message {
      max-width: 750px;
      margin: 12px auto;
      padding: 14px 16px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #20262e;
    }

    .ai {
      background: #14191f;
      border: 1px solid #292f37;
    }

    .composer {
      width: min(800px, calc(100% - 20px));
      margin: 0 auto 8px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 7px;
      background: #151a20;
      border: 1px solid #303640;
      border-radius: 18px;
    }

    input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 16px;
      padding: 10px;
    }

    button {
      cursor: pointer;
    }

    .icon {
      background: transparent;
      color: #cbd1d8;
      border: 0;
      font-size: 20px;
    }

    .send {
      background: white;
      color: black;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: bold;
    }

    .disclaimer {
      text-align: center;
      color: #656d78;
      font-size: 11px;
      padding-bottom: 9px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 27px; }

      .suggestions {
        flex-direction: column;
        padding: 0 20px;
      }

      .suggestions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header>
      💡 LampAI
      <span class="status">● Online</span>
    </header>

    <main>
      <div id="chat">
        <div class="welcome">
          <div class="lamp">💡</div>
          <h1>What can I help with?</h1>
          <p>Ask LampAI anything.</p>

          <div class="suggestions">
            <button onclick="suggest('Explain something complicated simply')">
              Explain something
            </button>

            <button onclick="suggest('Give me some creative ideas')">
              Brainstorm ideas
            </button>

            <button onclick="suggest('Write me a short story')">
              Create something
            </button>
          </div>
        </div>
      </div>

      <form class="composer" onsubmit="sendMessage(event)">
        <button type="button" class="icon">＋</button>

        <input
          id="input"
          placeholder="Message LampAI..."
          autocomplete="off"
        >

        <button type="button" class="icon">🎙️</button>

        <button class="send" type="submit">
          ➤
        </button>
      </form>

      <div class="disclaimer">
        LampAI can make mistakes. Check important information.
      </div>
    </main>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");

    function suggest(text) {
      input.value = text;
      input.focus();
    }

    function sendMessage(event) {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      const welcome = document.querySelector(".welcome");
      if (welcome) welcome.remove();

      addMessage(text, "user");

      input.value = "";

      setTimeout(() => {
        addMessage(
          "LampAI is connected to the interface. The actual AI brain is the next thing we're adding. 🔥",
          "ai"
        );
      }, 500);
    }

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
