<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LampAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0d10;
      color: white;
      height: 100vh;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #252a31;
      font-size: 21px;
      font-weight: 800;
    }

    .status {
      margin-left: auto;
      font-size: 12px;
      color: #62e59a;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 25px 15px;
    }

    .welcome {
      text-align: center;
      margin-top: 15vh;
    }

    .lamp {
      font-size: 60px;
    }

    h1 {
      font-size: 34px;
      margin: 10px 0;
    }

    .welcome p {
      color: #8d96a3;
    }

    .suggestions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .suggestions button,
    .settings-button {
      background: #171b21;
      color: white;
      border: 1px solid #303640;
      border-radius: 12px;
      padding: 12px 15px;
    }

    .message {
      max-width: 750px;
      margin: 12px auto;
      padding: 14px 16px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #20262e;
    }

    .ai {
      background: #14191f;
      border: 1px solid #292f37;
    }

    .composer {
      width: min(800px, calc(100% - 20px));
      margin: 0 auto 8px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 7px;
      background: #151a20;
      border: 1px solid #303640;
      border-radius: 18px;
    }

    input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 16px;
      padding: 10px;
    }

    button {
      cursor: pointer;
    }

    .icon {
      background: transparent;
      color: #cbd1d8;
      border: 0;
      font-size: 20px;
    }

    .send {
      background: white;
      color: black;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: bold;
    }

    .disclaimer {
      text-align: center;
      color: #656d78;
      font-size: 11px;
      padding-bottom: 9px;
    }

    /* SETTINGS */

    .settings-button {
      position: absolute;
      right: 75px;
      top: 12px;
      padding: 8px 12px;
    }

    .settings {
      display: none;
      position: fixed;
      z-index: 20;
      inset: 0;
      background: rgba(0,0,0,.65);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .settings.open {
      display: flex;
    }

    .settings-box {
      width: min(520px, 100%);
      background: #15191f;
      border: 1px solid #303640;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 70px rgba(0,0,0,.5);
    }

    .settings-box h2 {
      margin-top: 0;
    }

    .settings-box p {
      color: #929aa5;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      background: #0d1014;
      color: white;
      border: 1px solid #303640;
      border-radius: 12px;
      padding: 13px;
      outline: none;
      font: inherit;
    }

    .settings-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }

    .save {
      background: white;
      color: black;
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: bold;
    }

    .close {
      background: #252a31;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 27px;
      }

      .suggestions {
        flex-direction: column;
        padding: 0 20px;
      }

      .suggestions button {
        width: 100%;
      }

      .settings-button {
        right: 65px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    💡 LampAI

    <button class="settings-button" onclick="openSettings()">
      ⚙️
    </button>

    <span class="status">● Online</span>
  </header>

  <main>

    <div id="chat">

      <div class="welcome">

        <div class="lamp">💡</div>

        <h1>What can I help with?</h1>

        <p>Ask LampAI anything.</p>

        <div class="suggestions">

          <button onclick="suggest('Explain something complicated simply')">
            Explain something
          </button>

          <button onclick="suggest('Give me some creative ideas')">
            Brainstorm ideas
          </button>

          <button onclick="suggest('Write me a short story')">
            Create something
          </button>

        </div>

      </div>

    </div>

    <form class="composer" onsubmit="sendMessage(event)">

      <button type="button" class="icon">
        ＋
      </button>

      <input
        id="input"
        placeholder="Message LampAI..."
        autocomplete="off"
      >

      <button type="button" class="icon">
        🎙️
      </button>

      <button id="send" class="send" type="submit">
        ➤
      </button>

    </form>

    <div class="disclaimer">
      LampAI can make mistakes. Check important information.
    </div>

  </main>

</div>


<!-- SETTINGS -->

<div id="settings" class="settings">

  <div class="settings-box">

    <h2>⚙️ LampAI Settings</h2>

    <p>
      Tell LampAI how you want it to behave.
      You can change its personality, tone, mood, or style.
    </p>

    <textarea
      id="instructions"
      placeholder="Example: Be funny, energetic, sarcastic, and talk like a close friend."
    ></textarea>

    <div class="settings-actions">

      <button class="close" onclick="closeSettings()">
        Cancel
      </button>

      <button class="save" onclick="saveInstructions()">
        Save
      </button>

    </div>

  </div>

</div>


<script>

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendButton = document.getElementById("send");
const instructionsBox = document.getElementById("instructions");


/* LOAD SAVED INSTRUCTIONS */

instructionsBox.value =
  localStorage.getItem("lampai_instructions") || "";


/* SETTINGS */

function openSettings() {
  document.getElementById("settings").classList.add("open");
}

function closeSettings() {
  document.getElementById("settings").classList.remove("open");
}

function saveInstructions() {

  const instructions = instructionsBox.value.trim();

  localStorage.setItem(
    "lampai_instructions",
    instructions
  );

  closeSettings();

}


/* SUGGESTIONS */

function suggest(text) {

  input.value = text;

  input.focus();

}


/* ADD MESSAGE */

function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

  return message;

}


/* SEND MESSAGE */

async function sendMessage(event) {

  event.preventDefault();

  const text = input.value.trim();

  if (!text) return;


  const welcome = document.querySelector(".welcome");

  if (welcome) {
    welcome.remove();
  }


  addMessage(text, "user");

  input.value = "";

  input.disabled = true;

  sendButton.disabled = true;


  const thinking = addMessage(
    "LampAI is thinking...",
    "ai"
  );


  try {

    const instructions =
      localStorage.getItem("lampai_instructions") || "";


    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        message: text,

        instructions: instructions

      })

    });


    const data = await response.json();


    thinking.remove();


    if (!response.ok) {

      addMessage(
        data.error || "LampAI ran into an error.",
        "ai"
      );

      return;

    }


    addMessage(
      data.reply || "LampAI didn't return a response.",
      "ai"
    );


  } catch (error) {

    thinking.remove();

    addMessage(
      "LampAI couldn't connect to the AI server.",
      "ai"
    );

  } finally {

    input.disabled = false;

    sendButton.disabled = false;

    input.focus();

  }

}

</script>

</body>
</html>
